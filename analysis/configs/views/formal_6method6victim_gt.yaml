name: gt
input: results/comparisons/formal_6method6victim_all/merged_long_table.csv
output: results/comparisons/formal_6method6victim_all/gt

filters:
  victim_model: [srgnn, miasrec, tron, mdhg, freqrec, wearec]
  attack_method: [clean, random_nz, generated_direct_cem, copy_direct_cem, creat, poisoning_ssl_sbr]
  poison_model: srgnn
  attack_size: 0.01
  metric_name: recall
  metric_scope: ground_truth
  k: 20

split_by: []
rows: [dataset, target_type, attack_method]
cols: [victim_group, victim_model]
value_col: value
agg: mean
auto_context: true
require_unique_cells: false

mean_std:
  enabled: true
  ddof: 1
  std_round_digits: 3

ground_truth_relative_to_clean:
  enabled: true
  baseline_attack_method: clean
  value_display: absolute
  highlight: text

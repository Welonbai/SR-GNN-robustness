style_name: diginetica_ptscem_randomnz_clean_sample5_mean_targets

output_format: png

title:
  template: "Diginetica | mean targets 11103 / 39588 / 5334 / 5418 / 14514 | Clean / Random-NZ / CEM"
  align: center
  font_size: 12
  color: black

figure:
  width: 14.5
  height: 5.8
  dpi: 220
  background_color: white

table:
  font_size: 11
  round_digits: 6
  signed_percent_round_digits: 3
  text_color: black
  show_grid: true
  auto_shrink: false
  wrap_text: false
  cell_align: center
  top_level_group_separators: true

  display_alias:
    labels:
      attack_method: Attack
      victim_model: Victim
      metric_name: Metric
      metric_scope: Scope
      k: K

    attack_method:
      clean: Clean
      random_nonzero_when_possible: Random-NZ
      cem: CEM

    victim_model:
      miasrec: MiaSRec
      srgnn: SRGNN
      tron: TRON

    metric_name:
      recall: Recall
      mrr: MRR

    metric_scope:
      ground_truth: GT
      targeted: Target

  value_alias: {}

  dimension_value_orders:
    victim_model:
      - srgnn
      - miasrec
      - tron
    attack_method:
      - clean
      - random_nonzero_when_possible
      - cem

  best_value_bolding:
    compare_along: rows
    mode: max
    underline_second_best: false
    partition_by_levels:
      - victim_model
    column_filters:
      metric_scope: targeted

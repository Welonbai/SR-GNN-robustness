style_name: formal_6method6victim_best_top2_recall50
output_format: png

title:
  template: "Best/top-2 counts for Recall@50."
  align: center
  font_size: 18
  color: "#111111"

figure:
  width: 8.8
  height: 3.8
  dpi: 180
  background_color: "#FFFFFF"

table:
  font_size: 13
  header_font_size: 12
  row_leaf_label_font_size: 13
  data_font_size: 14
  font_height_fraction: 0.82
  round_digits: 0
  signed_percent_round_digits: 1
  text_color: "#111111"
  count_percentage_denominator: 24
  count_percentage_round_digits: 1
  show_grid: true
  auto_shrink: true
  wrap_text: false
  cell_align: center
  top_level_group_separators: true
  stub_column_width_weight: 2.6
  leaf_column_width_weight: 1.35
  signed_percent_heatmap_strength: 0.5
  display_alias:
    labels:
      k: K
      rank_subject: method
      rank_threshold: rank
    values:
      rank_subject:
        random_nz: RANDOM-NZ
        creat: CREAT-NZ
        poisoning_ssl_sbr: Poisoning-SSL-NZ
        generated_direct_cem: DA-CEM-G
        copy_direct_cem: DA-CEM-C
      rank_threshold:
        best: best
        top2: top-2
  value_alias: {}
  dimension_value_orders:
    k: [50]
    rank_subject: [random_nz, creat, poisoning_ssl_sbr, generated_direct_cem, copy_direct_cem]
    rank_threshold: [best, top2]
  scope_colors: {}
  best_value_bolding:
    compare_along: rows
    mode: max
    partition_by_levels: []
    bold_best: true
    underline_second_best: true
    best_text_color: "#C00000"
    second_best_text_color: "#0066CC"

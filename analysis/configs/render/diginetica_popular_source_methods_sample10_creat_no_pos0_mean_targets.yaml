style_name: diginetica_popular_source_methods_sample10_creat_no_pos0_mean_targets

output_format: png

title:
  template: "Diginetica popular | mean of 10 target items | SRGNN / MiaSRec | CREAT nonzero DPP 0.01 consistency 0.3"
  align: center
  font_size: 12
  color: black

figure:
  width: 15.5
  height: 6.5
  dpi: 220
  background_color: white

table:
  font_size: 9
  round_digits: 6
  signed_percent_round_digits: 3
  text_color: black
  show_grid: true
  auto_shrink: true
  wrap_text: false
  cell_align: center
  top_level_group_separators: true
  stub_column_width_weight: 1.0

  display_alias:
    labels:
      attack_method: Attack
      victim_model: Victim
      metric_name: Metric
      metric_scope: Scope
      k: K

    attack_method:
      clean: Clean
      random_nz: randomNZ
      generated_direct_cem: generated cem
      copy_direct_cem: copy cem
      creat_no_pos0: creat

    victim_model:
      miasrec: MiaSRec
      srgnn: SRGNN

    metric_name:
      recall: Recall
      mrr: MRR

    metric_scope:
      ground_truth: GT
      targeted: Target

  value_alias: {}

  dimension_value_orders:
    victim_model:
      - srgnn
      - miasrec
    attack_method:
      - clean
      - random_nz
      - generated_direct_cem
      - copy_direct_cem
      - creat_no_pos0

  best_value_bolding:
    compare_along: rows
    mode: max
    underline_second_best: true
    partition_by_levels:
      - victim_model
    column_filters:
      metric_scope: targeted

experiment:
  name: ssh_diginetica_valbest_attack_create_copy_source_unpopular_sample_openpos0_dpp001_consistency03

data:
  dataset_name: diginetica
  split_protocol: unified
  poison_train_only: true
  canonical_split:
    min_item_count: 5
    min_session_len: 2
    valid_ratio: 0.1
    test_days: 7

seeds:
  fake_session_seed: 20260405
  target_selection_seed: 20260405
  position_opt_seed: 20260405
  surrogate_train_seed: 20260405
  victim_train_seed: 20260405

attack:
  size: 0.01
  fake_session_generation_topk: 100
  replacement_topk_ratio: 1.0
  fake_session_source:
    type: train_template_clean_exact_length_matched
    train_template:
      reference_split: train_sub
      target_filtering: none
      replacement: false
      fallback:
        nearest_length_redistribution: true
        replacement_if_needed: true
      record_distribution_diagnostics: true

  poison_model:
    name: srgnn
    params:
      train:
        epochs: 30
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: validation_best
        best_metric: valid_ground_truth_mrr@20
        patience_metric: recall20_or_mrr20

  creat_additive_sbr:
    enabled: true
    variant: v2
    epochs: 10
    attack_epochs: 10
    consistency_epochs: 10
    batch_size: 128
    lr: 0.001
    hidden_dim: 64
    position_embedding_dim: 16
    max_attack_num: 1
    nonzero_when_possible: false
    attack_reward_mode: score
    stealth_weight: 0.1
    local_weight: 0.0
    entropy_weight: 0.0
    pattern_reward_weight: 0.1
    dpp_reward_weight: 0.01
    dpp_score_mode: bounded_determinant
    dpp_eps: 1.0e-6
    global_consistency_weight: 0.3
    local_consistency_weight: 0.3
    local_window_size: 3
    consistency_mode: local_global
    final_policy_selection: last
    seed_source: position_opt_seed

targets:
  mode: sampled
  explicit_list: []
  bucket: unpopular
  count: 10
  reuse_saved_targets: false

victims:
  enabled: [srgnn, miasrec, tron]
  params:
    srgnn:
      train:
        epochs: 4
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: fixed_last
    miasrec:
      train:
        epochs: 5
        checkpoint_protocol: fixed_epoch
        validation_enabled: false
        export_model: last
        train_batch_size: 32
        eval_batch_size: 32
    tron:
      train:
        epochs: 7
        checkpoint_protocol: fixed_epoch
        validation_enabled: false
        export_model: last
  runtime:
    miasrec:
      python_executable: "/data2/welon/miniconda3/envs/miasrec/bin/python"
      repo_root: "/data2/welon/SR-GNN-robustness/third_party/miasrec"
      working_dir: "/data2/welon/SR-GNN-robustness/third_party/miasrec"
      device:
        use_gpu: true
        gpu_id: "1"
      logging:
        show_progress: false
    tron:
      python_executable: "/data2/welon/miniconda3/envs/tron-gpu/bin/python"
      repo_root: "/data2/welon/SR-GNN-robustness/third_party/tron"
      working_dir: "/data2/welon/SR-GNN-robustness/third_party/tron"
      device:
        use_gpu: true
        gpu_id: "1"
      dataloader:
        num_workers: 2

evaluation:
  topk: [5, 10, 15, 20, 25, 30, 40, 50]
  targeted_metrics: [precision, recall, mrr, ndcg]
  ground_truth_metrics: [precision, recall, mrr, ndcg]

artifacts:
  root: outputs
  shared_dir: shared
  runs_dir: runs
  cleanup_victim_intermediates: false

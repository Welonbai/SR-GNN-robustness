# Windows-local MDHG fixed-epoch convergence diagnostic only.
# This is not validation-best, early stopping, checkpoint selection, or per-target
# epoch selection. Use the results only to choose one global fixed epoch count for
# future formal MDHG runs. Formal configs should leave diagnostics disabled.
# This clean run uses a separate experiment directory and does not test CEM reuse.
experiment:
  name: diagnostic_diginetica_valbest_clean_mdhg_epoch_one_target

data:
  dataset_name: diginetica
  split_protocol: unified
  poison_train_only: true
  canonical_split:
    min_item_count: 5
    min_session_len: 2
    valid_ratio: 0.1
    test_days: 7

seeds:
  fake_session_seed: 20260405
  target_selection_seed: 20260405
  position_opt_seed: 20260405
  surrogate_train_seed: 20260405
  victim_train_seed: 20260405

attack:
  size: 0.01
  fake_session_generation_topk: 100
  replacement_topk_ratio: 1.0
  poison_model:
    name: srgnn
    params:
      train:
        epochs: 30
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: validation_best
        best_metric: valid_ground_truth_mrr@20
        patience_metric: recall20_or_mrr20

targets:
  mode: sampled
  explicit_list: []
  bucket: popular
  count: 1
  reuse_saved_targets: true

victims:
  enabled: [mdhg]
  params:
    mdhg:
      train:
        epochs: 20
        batch_size: 100
        lr: 0.001
        checkpoint_protocol: fixed_epoch
        validation_enabled: false
        export_model: last
  runtime:
    mdhg:
      python_executable: "C:\\Users\\User\\anaconda3\\python.exe"
      repo_root: "D:\\code_SBR_robustness\\SR-GNN-robustness\\third_party\\mdhg"
      working_dir: "D:\\code_SBR_robustness\\SR-GNN-robustness\\third_party\\mdhg"
      device:
        use_gpu: true
        gpu_id: "0"
      diagnostics:
        epoch_metrics: true
        per_epoch_predictions: true

evaluation:
  topk: [5, 10, 15, 20, 25, 30, 40, 50]
  targeted_metrics: [precision, recall, mrr, ndcg]
  ground_truth_metrics: [precision, recall, mrr, ndcg]

artifacts:
  root: outputs
  shared_dir: shared
  runs_dir: runs
  cleanup_victim_intermediates: false

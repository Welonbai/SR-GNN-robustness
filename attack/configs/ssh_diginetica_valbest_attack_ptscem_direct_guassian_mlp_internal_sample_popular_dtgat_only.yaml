experiment:
  name: diginetica_valbest_attack_ptscem_direct_guassian_mlp_internal_sample

data:
  dataset_name: diginetica
  split_protocol: unified
  poison_train_only: true
  canonical_split:
    min_item_count: 5
    min_session_len: 2
    valid_ratio: 0.1
    test_days: 7

seeds:
  fake_session_seed: 20260405
  target_selection_seed: 20260405
  position_opt_seed: 20260405
  surrogate_train_seed: 20260405
  victim_train_seed: 20260405

attack:
  size: 0.01
  fake_session_generation_topk: 100
  replacement_topk_ratio: 1.0

  poison_model:
    name: srgnn
    params:
      train:
        epochs: 4
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: fixed_last
        validation_enabled: false
        export_model: last

  pts_construction:
    enabled: true
    method: direct_action_mlp_cem

    prefix_selector:
      range: internal
      sampler: uniform

    generation:
      topk: 100
      length_policy: same_as_residual_suffix

    direct_action_policy:
      parameterization: direct_action_mlp_h2
      length_feature: z_score

    cem:
      iterations: 3
      population_schedule: [16, 8, 8]
      elite_ratio: 0.25
      sampler:
        type: gaussian
        concentration_scale: 20.0
      update:
        mode: elite_centered_empirical_gaussian
        elite_min_std: 0.25
      seed_source: position_opt_seed
      candidate_seed_stride: 1000
      save_top_k_candidates: 1
      surrogate_retrain:
        checkpoint_protocol: fixed_last
        validation_enabled: false
        reward_checkpoint: last
      epoch_reward_diagnostics:
        enabled: false

    reward:
      target_summary: raw_lowk_mrr_recall_10_20
      enable_gt_penalty: false
      gt_penalty_weight: 0.0
      enable_length_penalty: false
      length_penalty_weight: 0.0

    artifacts:
      save_cem_trace: true
      save_best_policy: true
      save_final_policy: true
      save_per_session_records: false
      save_candidate_sessions: false
      save_best_sessions: true
      save_top_candidate_sessions: true

    final_selection:
      mode: global_best_candidate

targets:
  mode: sampled
  explicit_list: []
  bucket: popular
  count: 10
  reuse_saved_targets: false

victims:
  enabled: [dtgat]
  params:
    srgnn:
      train:
        epochs: 4
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: fixed_last
        validation_enabled: false
        export_model: last
    dtgat:
      train:
        epochs: 4
        batch_size: 100
        emb_size: 100
        time_dims: 100
        intent_num: 4
        lr: 0.001
        dropout: 0.0
        l2: 1.0e-4
        lr_dc: 0.1
        lr_dc_step: 10
        layer: 1
        beta: 0.005
        topk: 50
        per_epoch_diagnostics: false
        checkpoint_protocol: fixed_epoch
        validation_enabled: false
        export_model: last
  runtime:
    dtgat:
      python_executable: "C:\\Users\\User\\anaconda3\\python.exe"
      repo_root: "D:\\code_SBR_robustness\\SR-GNN-robustness\\third_party\\dtgat"
      working_dir: "D:\\code_SBR_robustness\\SR-GNN-robustness\\third_party\\dtgat"
      device:
        use_gpu: true
        gpu_id: "0"

evaluation:
  topk: [5, 10, 15, 20, 25, 30, 40, 50]
  targeted_metrics: [precision, recall, mrr, ndcg]
  ground_truth_metrics: [precision, recall, mrr, ndcg]

artifacts:
  root: outputs
  shared_dir: shared
  runs_dir: runs
  cleanup_victim_intermediates: true

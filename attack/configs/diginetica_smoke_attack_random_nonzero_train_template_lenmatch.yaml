experiment:
  name: diginetica_smoke_attack_random_nonzero_train_template_lenmatch

data:
  dataset_name: diginetica
  split_protocol: unified
  poison_train_only: true
  canonical_split:
    min_item_count: 5
    min_session_len: 2
    valid_ratio: 0.1
    test_days: 7

seeds:
  fake_session_seed: 20260405
  target_selection_seed: 20260405
  position_opt_seed: 20260405
  surrogate_train_seed: 20260405
  victim_train_seed: 20260405

attack:
  size: 0.01
  fake_session_generation_topk: 100
  replacement_topk_ratio: 1.0
  fake_session_source:
    type: train_template_clean_exact_length_matched
    train_template:
      reference_split: train_sub
      target_filtering: none
      replacement: false
      fallback:
        nearest_length_redistribution: true
        replacement_if_needed: true
      record_distribution_diagnostics: true
  poison_model:
    name: srgnn
    params:
      train:
        epochs: 1
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: fixed_last
        validation_enabled: false
        export_model: last

targets:
  mode: sampled
  explicit_list: []
  bucket: unpopular
  count: 1
  reuse_saved_targets: false

victims:
  enabled: [srgnn]
  params:
    srgnn:
      train:
        epochs: 1
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: fixed_last
        validation_enabled: false
        export_model: last

evaluation:
  topk: [5, 10, 20]
  targeted_metrics: [precision, recall, mrr, ndcg]
  ground_truth_metrics: [precision, recall, mrr, ndcg]

artifacts:
  root: outputs
  shared_dir: shared
  runs_dir: runs
  cleanup_victim_intermediates: true

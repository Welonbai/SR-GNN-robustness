# Local clean Diginetica WEARec fixed-epoch diagnostic.
# Validation ranking metrics are recorded after every epoch. The final
# checkpoint and test predictions always come from the requested last epoch.
experiment:
  name: diginetica_wearec_clean_epoch_diagnostic

data:
  dataset_name: diginetica
  split_protocol: unified
  poison_train_only: true
  canonical_split:
    min_item_count: 5
    min_session_len: 2
    valid_ratio: 0.1
    test_days: 7

seeds:
  fake_session_seed: 20260405
  target_selection_seed: 20260405
  position_opt_seed: 20260405
  surrogate_train_seed: 20260405
  victim_train_seed: 20260405

attack:
  size: 0.01
  fake_session_generation_topk: 100
  replacement_topk_ratio: 1.0
  poison_model:
    name: srgnn
    params:
      train:
        epochs: 30
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: validation_best
        best_metric: valid_ground_truth_mrr@20
        patience_metric: recall20_or_mrr20

targets:
  mode: sampled
  explicit_list: []
  bucket: popular
  count: 1
  reuse_saved_targets: true

victims:
  enabled: [wearec]
  params:
    wearec:
      train:
        model_type: WEARec
        epochs: 30
        batch_size: 256
        lr: 0.001
        max_seq_length: 50
        hidden_size: 64
        num_hidden_layers: 2
        hidden_act: gelu
        hidden_dropout_prob: 0.5
        initializer_range: 0.02
        num_heads: 2
        alpha: 0.3
        adam_beta1: 0.9
        adam_beta2: 0.999
        weight_decay: 0.0
        checkpoint_protocol: fixed_epoch
        metric_cutoffs: [5, 10, 20]
  runtime:
    wearec:
      python_executable: "C:\\Users\\User\\anaconda3\\python.exe"
      repo_root: "D:\\code_SBR_robustness\\SR-GNN-robustness\\third_party\\wearec"
      working_dir: "D:\\code_SBR_robustness\\SR-GNN-robustness\\third_party\\wearec"
      device:
        use_gpu: true
        gpu_id: "0"
      dataloader:
        num_workers: 0
      diagnostics:
        per_epoch_predictions: false

evaluation:
  topk: [5, 10, 20]
  targeted_metrics: [precision, recall, mrr, ndcg]
  ground_truth_metrics: [precision, recall, mrr, ndcg]

artifacts:
  root: outputs
  shared_dir: shared
  runs_dir: runs
  cleanup_victim_intermediates: false

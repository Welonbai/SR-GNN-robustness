experiment:
  name: valbest_attack_pts_construction_continuous_mlp_cem_ratio1_srgnn_partial4_target5334

data:
  dataset_name: diginetica
  split_protocol: unified
  poison_train_only: true
  canonical_split:
    min_item_count: 5
    min_session_len: 2
    valid_ratio: 0.1
    test_days: 7

seeds:
  fake_session_seed: 20260405
  target_selection_seed: 20260405
  position_opt_seed: 20260405
  surrogate_train_seed: 20260405
  victim_train_seed: 20260405

attack:
  size: 0.01
  fake_session_generation_topk: 100
  replacement_topk_ratio: 1.0

  poison_model:
    name: srgnn
    params:
      train:
        epochs: 30
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: validation_best
        best_metric: valid_ground_truth_mrr@20
        patience_metric: recall20_or_mrr20

  pts_construction:
    enabled: true
    method: continuous_mlp_cem

    prefix_selector:
      range: internal
      sampler: uniform

    generation:
      topk: 100
      length_policy: same_as_residual_suffix

    continuous_policy:
      parameterization: suffix_length_mlp
      hidden_size: 2
      consume_distribution: beta
      source_policy: q_and_rho_logistic
      parameter_bounds:
        min: -5.0
        max: 5.0
      smoothing_epsilon: 0.1
      deterministic_sampling: true

    cem:
      iterations: 3
      population_schedule: [16, 8, 8]
      elite_ratio: 0.25
      sampler:
        type: gaussian
        concentration_scale: 20.0
      update:
        smoothing: 0.3
        min_probability: 0.03
        max_probability: 0.90
        min_std: 0.25
      init:
        mode: two_pool_behavior_curve_space_filling
        soft_extreme_pool_size: 512
        moderate_pool_size: 512
        soft_extreme_select_size: 5
        moderate_select_size: 11
        soft_extreme_initial_std: 1.25
        moderate_initial_std: 0.8
        q_grid_size: 19
        behavior_distance: l1
        init_materialize_generated_suffix: false
      seed_source: position_opt_seed
      candidate_seed_stride: 1000
      save_top_k_candidates: 3
      epoch_reward_diagnostics:
        enabled: false

    reward:
      target_summary: raw_lowk_mrr_recall_10_20
      enable_gt_penalty: false
      gt_penalty_weight: 0.0
      enable_length_penalty: false
      length_penalty_weight: 0.0

    artifacts:
      save_cem_trace: true
      save_best_policy: true
      save_final_policy: true
      save_per_session_records: true
      save_candidate_sessions: false
      save_best_sessions: true
      save_top_candidate_sessions: true

    final_selection:
      mode: global_best_candidate

targets:
  mode: explicit_list
  explicit_list: [5334]
  bucket: popular
  count: 1
  reuse_saved_targets: false

victims:
  enabled: [srgnn]
  params:
    srgnn:
      train:
        epochs: 4
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: validation_best
        best_metric: valid_ground_truth_mrr@20
        patience_metric: recall20_or_mrr20

evaluation:
  topk: [5, 10, 15, 20, 25, 30, 40, 50]
  targeted_metrics: [precision, recall, mrr, ndcg]
  ground_truth_metrics: [precision, recall, mrr, ndcg]

artifacts:
  root: outputs
  shared_dir: shared
  runs_dir: runs

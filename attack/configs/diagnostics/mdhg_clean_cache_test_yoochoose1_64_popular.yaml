# Diagnostic-only MDHG clean shared-cache consistency test.
# Run with attack.pipeline.runs.run_clean. No poisoning is performed.
experiment:
  name: yoochoose1_64_mdhg_clean_cache_test_popular_local

data:
  dataset_name: yoochoose1_64
  split_protocol: unified
  poison_train_only: true
  canonical_split:
    min_item_count: 5
    min_session_len: 2
    valid_ratio: 0.1
    test_days: 1

seeds:
  fake_session_seed: 20260405
  target_selection_seed: 20260405
  position_opt_seed: 20260405
  surrogate_train_seed: 20260405
  victim_train_seed: 20260405

attack:
  size: 0.01
  fake_session_generation_topk: 100
  replacement_topk_ratio: 1.0
  poison_model:
    name: srgnn
    params:
      train:
        epochs: 4
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: fixed_last
        validation_enabled: false
        export_model: last

targets:
  mode: sampled
  explicit_list: []
  bucket: popular
  count: 10
  reuse_saved_targets: true

victims:
  enabled: [mdhg]
  params:
    mdhg:
      train:
        epochs: 2
        batch_size: 100
        lr: 0.001
        checkpoint_protocol: fixed_epoch
        validation_enabled: false
        export_model: last
  runtime:
    mdhg:
      python_executable: "C:\\Users\\User\\anaconda3\\python.exe"
      repo_root: "D:\\code_SBR_robustness\\SR-GNN-robustness\\third_party\\mdhg"
      working_dir: "D:\\code_SBR_robustness\\SR-GNN-robustness\\third_party\\mdhg"
      device:
        use_gpu: true
        gpu_id: "0"
      diagnostics:
        epoch_metrics: false
        per_epoch_predictions: false

evaluation:
  topk: [5, 10, 15, 20, 25, 30, 40, 50]
  targeted_metrics: [precision, recall, mrr, ndcg]
  ground_truth_metrics: [precision, recall, mrr, ndcg]

artifacts:
  root: outputs
  shared_dir: shared
  runs_dir: runs
  cleanup_victim_intermediates: true

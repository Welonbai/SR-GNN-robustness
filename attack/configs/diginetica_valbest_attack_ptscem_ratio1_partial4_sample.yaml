experiment:
  name: valbest_attack_ptscem_ratio1_partial4_sample

data:
  dataset_name: diginetica
  split_protocol: unified
  poison_train_only: true
  canonical_split:
    min_item_count: 5
    min_session_len: 2
    valid_ratio: 0.1
    test_days: 7

seeds:
  fake_session_seed: 20260405
  target_selection_seed: 20260405
  position_opt_seed: 20260405
  surrogate_train_seed: 20260405
  victim_train_seed: 20260405

attack:
  size: 0.01
  fake_session_generation_topk: 100
  replacement_topk_ratio: 1.0

  poison_model:
    name: srgnn
    params:
      train:
        epochs: 30
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: validation_best
        best_metric: valid_ground_truth_mrr@20
        patience_metric: recall20_or_mrr20

  pts_construction:
    enabled: true
    method: grouped_cem_v1

    prefix_selector:
      range: internal
      sampler: uniform

    grouping:
      mode: residual_suffix_length
      buckets:
        - name: suffix_1
          min: 1
          max: 1
        - name: suffix_2
          min: 2
          max: 2
        - name: suffix_3plus
          min: 3
          max: null

    actions:
      enabled:
        - keep_residual_suffix
        - regenerate_residual_suffix
        - consume_one_keep_rest
        - consume_one_generate_continuation
        - consume_all_stop
      dynamic_masks:
        disable_consume_one_when_suffix_len_leq_1: true

    generation:
      topk: 100
      length_policy: same_as_residual_suffix

    cem:
      iterations: 3
      population_schedule: [16, 8, 8]
      elite_ratio: 0.25
      sampler:
        type: dirichlet
        concentration_scale: 20.0
      update:
        smoothing: 0.3
        min_probability: 0.03
        max_probability: 0.90
      init:
        mode: vertex_stratified_space_filling
        mandatory_enabled: true
        extreme_count: 7
        moderate_count: 3
        balanced_count: 1
        extreme_pool_size: 1024
        moderate_pool_size: 512
        extreme_alpha: 0.3
        moderate_alpha: 2.0
        distance: l1
      resampling:
        mode: elite_centered
        local_concentration_scale: 30.0
      seed_source: position_opt_seed
      candidate_seed_stride: 1000
      save_top_k_candidates: 3
      epoch_reward_diagnostics:
        enabled: false

    reward:
      target_summary: raw_lowk_mrr_recall_10_20
      enable_gt_penalty: false
      gt_penalty_weight: 0.0
      enable_length_penalty: false
      length_penalty_weight: 0.0

    artifacts:
      save_cem_trace: true
      save_best_policy: true
      save_final_policy: true
      save_per_session_records: true
      save_candidate_sessions: false
      save_best_sessions: true
      save_top_candidate_sessions: true

    final_selection:
      mode: global_best_candidate

targets:
  mode: sampled
  explicit_list: []
  bucket: popular
  count: 3
  reuse_saved_targets: false

victims:
  enabled: [srgnn, miasrec, tron]
  params:
    srgnn:
      train:
        epochs: 4
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-5
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: validation_best
        best_metric: valid_ground_truth_mrr@20
        patience_metric: recall20_or_mrr20
    miasrec:
      train:
        epochs: 6
        train_batch_size: 64
        eval_batch_size: 32
    tron:
      train:
        max_epochs: 3
  runtime:
    miasrec:
      python_executable: "C:\\Users\\User\\anaconda3\\envs\\miasrec\\python.exe"
      repo_root: "D:\\code_SBR_robustness\\SR-GNN-robustness\\third_party\\miasrec"
      working_dir: "D:\\code_SBR_robustness\\SR-GNN-robustness\\third_party\\miasrec"
      device:
        use_gpu: true
        gpu_id: "0"
      logging:
        show_progress: false
    tron:
      python_executable: "C:\\Users\\User\\anaconda3\\envs\\tron-gpu\\python.exe"
      repo_root: "D:\\code_SBR_robustness\\SR-GNN-robustness\\third_party\\tron"
      working_dir: "D:\\code_SBR_robustness\\SR-GNN-robustness\\third_party\\tron"
      device:
        use_gpu: true
        gpu_id: "0"
      dataloader:
        num_workers: 2

evaluation:
  topk: [5, 10, 15, 20, 25, 30, 40, 50]
  targeted_metrics: [precision, recall, mrr, ndcg]
  ground_truth_metrics: [precision, recall, mrr, ndcg]

artifacts:
  root: outputs
  shared_dir: shared
  runs_dir: runs

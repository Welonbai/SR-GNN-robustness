experiment:
  name: ssh_yoochoose1_64_valbest_clean_sample10_popular
data:
  dataset_name: yoochoose1_64
  split_protocol: unified
  poison_train_only: true
  canonical_split:
    min_item_count: 5
    min_session_len: 2
    valid_ratio: 0.1
    test_days: 1
seeds:
  fake_session_seed: 20260405
  target_selection_seed: 20260405
  position_opt_seed: 20260405
  surrogate_train_seed: 20260405
  victim_train_seed: 20260405
attack:
  size: 0.01
  fake_session_generation_topk: 100
  replacement_topk_ratio: 1.0
  poison_model:
    name: srgnn
    params:
      train:
        epochs: 30
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-05
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: validation_best
        best_metric: valid_ground_truth_mrr@20
        patience_metric: recall20_or_mrr20
targets:
  mode: sampled
  explicit_list: []
  bucket: popular
  count: 10
  reuse_saved_targets: true
victims:
  enabled:
  - dtgat
  params:
    dtgat:
      train:
        epochs: 4
        batch_size: 16
        emb_size: 100
        time_dims: 100
        intent_num: 4
        lr: 0.001
        dropout: 0.0
        l2: 0.0001
        lr_dc: 0.1
        lr_dc_step: 10
        layer: 1
        beta: 0.005
        topk: 50
        per_epoch_diagnostics: false
        checkpoint_protocol: fixed_epoch
        validation_enabled: false
        export_model: last
  runtime:
    dtgat:
      python_executable: C:\Users\User\anaconda3\python.exe
      repo_root: D:\code_SBR_robustness\SR-GNN-robustness\third_party\dtgat
      working_dir: D:\code_SBR_robustness\SR-GNN-robustness\third_party\dtgat
      device:
        use_gpu: true
        gpu_id: '0'
evaluation:
  topk:
  - 5
  - 10
  - 15
  - 20
  - 25
  - 30
  - 40
  - 50
  targeted_metrics:
  - precision
  - recall
  - mrr
  - ndcg
  ground_truth_metrics:
  - precision
  - recall
  - mrr
  - ndcg
artifacts:
  root: outputs
  shared_dir: shared
  runs_dir: runs
  cleanup_victim_intermediates: true

# Budget variant copied from attack/configs/diginetica_valbest_attack_random_nonzero_when_possible_ratio1_unpopular_sample10_fixed_epoch.yaml, attack/configs/ssh_diginetica_valbest_attack_random_nonzero_when_possible_ratio1_unpopular_sample10_fixed_epoch_freqrec_only.yaml, attack/configs/ssh_diginetica_valbest_attack_random_nonzero_when_possible_ratio1_unpopular_sample10_fixed_epoch_mdhg_only.yaml, attack/configs/ssh_diginetica_valbest_attack_random_nonzero_when_possible_ratio1_unpopular_sample10_fixed_epoch_wearec_only.yaml.
# Scientific method settings are preserved; split victim supplements are consolidated.
experiment:
  name: diginetica_valbest_attack_random_nonzero_when_possible_ratio1_unpopular_budget0p03_shard_23414_33995_all_victims
data:
  dataset_name: diginetica
  split_protocol: unified
  poison_train_only: true
  canonical_split:
    min_item_count: 5
    min_session_len: 2
    valid_ratio: 0.1
    test_days: 7
seeds:
  fake_session_seed: 20260405
  target_selection_seed: 20260405
  position_opt_seed: 20260405
  surrogate_train_seed: 20260405
  victim_train_seed: 20260405
attack:
  size: 0.03
  fake_session_generation_topk: 100
  replacement_topk_ratio: 1.0
  poison_model:
    name: srgnn
    params:
      train:
        epochs: 4
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-05
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: fixed_last
        validation_enabled: false
        export_model: last
targets:
  mode: explicit_list
  explicit_list:
  - 23414
  - 33995
  bucket: unpopular
  count: 2
  reuse_saved_targets: false
victims:
  enabled:
  - freqrec
  - srgnn
  - miasrec
  - tron
  - mdhg
  - wearec
  params:
    srgnn:
      train:
        epochs: 4
        batch_size: 100
        hidden_size: 100
        lr: 0.001
        lr_dc: 0.1
        lr_dc_step: 3
        l2: 1.0e-05
        step: 1
        patience: 10
        nonhybrid: false
        checkpoint_protocol: fixed_last
        validation_enabled: false
        export_model: last
    miasrec:
      train:
        epochs: 5
        train_batch_size: 32
        eval_batch_size: 32
        checkpoint_protocol: fixed_epoch
        validation_enabled: false
        export_model: last
    tron:
      train:
        max_epochs: 7
        checkpoint_protocol: fixed_epoch
        validation_enabled: false
        export_model: last
    freqrec:
      train:
        model_type: freqrec
        epochs: 18
        batch_size: 512
        lr: 0.0005
        max_seq_length: 50
        hidden_size: 64
        num_hidden_layers: 2
        num_attention_heads: 1
        hidden_act: gelu
        attention_probs_dropout_prob: 0.5
        hidden_dropout_prob: 0.5
        initializer_range: 0.02
        alpha: 0.7
        gama: 0.7
        alpha_loss: 0.6
        fft_loss_type: l2
        chux: p
        adam_beta1: 0.9
        adam_beta2: 0.999
        weight_decay: 0.0
        patience: 4
        fre: 1.0
        fourier_loss: true
        checkpoint_protocol: fixed_epoch
        validation_metric: ndcg@20
        metric_cutoffs:
        - 5
        - 10
        - 20
    mdhg:
      train:
        epochs: 2
        batch_size: 100
        lr: 0.001
        checkpoint_protocol: fixed_epoch
        validation_enabled: false
        export_model: last
    wearec:
      train:
        model_type: WEARec
        epochs: 23
        batch_size: 256
        lr: 0.001
        max_seq_length: 50
        hidden_size: 64
        num_hidden_layers: 2
        hidden_act: gelu
        hidden_dropout_prob: 0.5
        initializer_range: 0.02
        num_heads: 2
        alpha: 0.3
        adam_beta1: 0.9
        adam_beta2: 0.999
        weight_decay: 0.0
        checkpoint_protocol: fixed_epoch
        metric_cutoffs:
        - 5
        - 10
        - 20
  runtime:
    miasrec:
      python_executable: C:\Users\User\anaconda3\envs\miasrec\python.exe
      repo_root: D:\code_SBR_robustness\SR-GNN-robustness\third_party\miasrec
      working_dir: D:\code_SBR_robustness\SR-GNN-robustness\third_party\miasrec
      device:
        use_gpu: true
        gpu_id: '0'
      logging:
        show_progress: false
    tron:
      python_executable: C:\Users\User\anaconda3\envs\tron-gpu\python.exe
      repo_root: D:\code_SBR_robustness\SR-GNN-robustness\third_party\tron
      working_dir: D:\code_SBR_robustness\SR-GNN-robustness\third_party\tron
      device:
        use_gpu: true
        gpu_id: '0'
